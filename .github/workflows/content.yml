# The public site's content inventory to Sentral (D-36): on every push to main that changes the site's pages,
# scripts/platform/publish-content.mjs sends one signed content.inventory event to Sentral's product-events, which
# files each page's search in Growth › SEO's content plan and tracks every search as a keyword.
#
# The two repository secrets are the owner's to add (Settings › Secrets and variables › Actions):
# PLATFORM_EVENTS_URL and PLATFORM_WEBHOOK_SECRET, the same values as the Vercel production environment. Until both
# exist the step says so and passes; nothing is sent.
name: Content to Sentral

on:
  push:
    branches: [main]
    paths: ['data/articles/**', 'data/pages/**', 'data/templates/**', 'lib/site/**', 'messages/en.json', '.github/workflows/content.yml']
  workflow_dispatch:

concurrency:
  group: content-to-sentral
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send the inventory
        env:
          PLATFORM_EVENTS_URL: ${{ secrets.PLATFORM_EVENTS_URL }}
          PLATFORM_WEBHOOK_SECRET: ${{ secrets.PLATFORM_WEBHOOK_SECRET }}
        run: node scripts/platform/publish-content.mjs
