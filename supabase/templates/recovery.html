<h2>Set a new password</h2>
<p>Press the button to choose a new password. The link works once, for 15 minutes.</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery">Set a new password</a></p>
<p>If you did not ask for this email, you can ignore it. Your password stays as it is.</p>
