<h2>Confirm your email</h2>
<p>Press the button to confirm this address and sign in. The link works once, for 15 minutes.</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email">Confirm and sign in</a></p>
<p>If you did not ask for this email, you can ignore it. No account is used without the link.</p>
