<h2>Sign in and make your group</h2>
<p>Press the button to sign in and make your group. The link works once, for 15 minutes.</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email">Sign in</a></p>
<p>If you did not ask for this email, you can ignore it. No account is used without the link.</p>
